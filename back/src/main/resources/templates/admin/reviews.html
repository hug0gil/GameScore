<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="layout :: head('Gestión de Reseñas')"></head>

<body>

    <div th:replace="layout :: header"></div>

    <main class="main-content-dark">
        <div class="container py-5">

            <div class="d-flex justify-content-between align-items-center admin-header pb-3 mb-4">
                <h1 class="text-white mb-0">Gestión de reseñas</h1>
            </div>

            <!-- Mensajes Flash de Éxito/Error -->
            <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show" role="alert">
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Buscador -->
            <form th:action="@{/admin/resenas}" method="get" class="mb-4">
                <div class="input-group auth-box p-0">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="text" name="keyword" class="form-control" placeholder="Buscar por título o usuario..."
                        th:value="${keyword}">
                </div>
            </form>

            <!-- Tabla de reseñas -->
            <div class="table-responsive">
                <table class="table table-admin">
                    <thead>
                        <tr class="text-center">
                            <th>Titulo del Juego</th>
                            <th>Usuario</th>
                            <th class="text-center">Puntuacion</th>
                            <th>Estado</th>
                            <th>Fecha de Creacion</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="review : ${reviews}">
                            <td>
                                <a th:href="@{/juego/{slug}(slug=${review.game.slug})}"
                                    class="text-black fw-bold link-hover" th:text="${review.game.name}"></a>
                            </td>
                            <td th:text="'@' + ${review.user.name}"></td>
                            <td class="text-center">
                                <div class="table-rating-stars">
                                    <span th:each="i : ${#numbers.sequence(1, 5)}">
                                        <i class="bi bi-star-fill star"
                                            th:classappend="${i <= review.rating ? 'filled' : ''}"></i>
                                    </span>
                                </div>
                            </td>
                            <td class="text-center">
                                <span th:text="${review.status}" th:classappend="${review.status.name() == 'PENDING' ? 'badge bg-warning text-dark' :
                                                       (review.status.name() == 'APPROVED' ? 'badge bg-success' :
                                                       'badge bg-danger')}"></span>
                            </td>
                            <td class="text-center"
                                th:text="${#temporals.format(review.createdAt, 'dd/MM/yyyy HH:mm')}"></td>
                            <td class="text-center">
                                <!-- Botón Offcanvas -->
                                <button class="btn action-icon text-info p-0 border-0 bg-transparent" type="button"
                                    data-bs-toggle="offcanvas"
                                    th:attr="data-bs-target='#offcanvasModerate__' + ${review.id}"
                                    title="Moderar Reseña">
                                    <i class="bi bi-pencil-square"></i>
                                </button>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(reviews)}">
                            <td colspan="6" class="text-center p-4">No se encontraron reseñas.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Paginación -->
            <nav th:if="${totalPages > 1}" aria-label="Page navigation">
                <ul class="pagination justify-content-center mt-4">

                    <!-- Botón Anterior -->
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link"
                            th:href="@{/admin/resenas(page=${currentPage-1}, keyword=${keyword}, paramStatus=${paramStatus}, paramRating=${paramRating})}"
                            aria-label="Previous">
                            <span aria-hidden="true">&laquo;</span>
                        </a>
                    </li>

                    <!-- Números de página -->
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages-1)}"
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link"
                            th:href="@{/admin/resenas(page=${i}, keyword=${keyword}, paramStatus=${paramStatus}, paramRating=${paramRating})}"
                            th:text="${i+1}"></a>
                    </li>

                    <!-- Botón Siguiente -->
                    <li class="page-item" th:classappend="${currentPage == totalPages-1} ? 'disabled'">
                        <a class="page-link"
                            th:href="@{/admin/resenas(page=${currentPage+1}, keyword=${keyword}, paramStatus=${paramStatus}, paramRating=${paramRating})}"
                            aria-label="Next">
                            <span aria-hidden="true">&raquo;</span>
                        </a>
                    </li>

                </ul>
            </nav>


        </div>
    </main>

    <!-- Offcanvas para cada review -->
    <div th:each="review : ${reviews}">
        <div class="offcanvas offcanvas-end" tabindex="-1" th:id="'offcanvasModerate__' + ${review.id}">
            <div class="offcanvas-header">
                <h5 class="offcanvas-title">Moderar Reseña</h5>
                <button type="button" class="btn-close text-reset" data-bs-dismiss="offcanvas"></button>
            </div>
            <div class="offcanvas-body">
                <form th:action="@{/admin/resenas/moderar/{id}(id=${review.id})}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Estado</label>
                        <select class="form-select" name="status">
                            <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"
                                th:selected="${s == review.status}">
                            </option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Guardar cambios</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Pie de página y scripts -->
    <div th:replace="layout :: footer"></div>
    <div th:replace="layout :: scripts"></div>

</body>

</html>
