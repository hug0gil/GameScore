<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="layout :: head('Gestión de Usuarios')"></head>

<body>

    <div th:replace="layout :: header"></div>

    <main class="main-content-dark">
        <div class="container py-5">

            <div class="d-flex justify-content-between align-items-center admin-header pb-3 mb-4">
                <h1 class="text-white mb-0">Gestión de usuarios</h1>
                <button class="btn btn-alt" type="button" data-bs-toggle="offcanvas"
                    data-bs-target="#filterUsersOffcanvas">
                    <i class="bi bi-funnel-fill"></i> Filtrar
                </button>
            </div>

            <form th:action="@{/admin/usuarios}" method="get" class="mb-4">
                <div class="input-group auth-box p-0">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="text" name="keyword" class="form-control" placeholder="Buscar por nombre o email"
                        th:value="${keyword}">
                </div>
            </form>

            <div class="table-responsive">
                <table class="table table-admin">
                    <thead>
                        <tr>
                            <th>Usuario</th>
                            <th class="text-center">Rol</th>
                            <th>Fecha de Registro</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="user : ${users}">
                            <td>
                                <img th:src="${user.avatarUrl}" class="admin-user-avatar" alt="Avatar">
                                <span th:text="${user.name}">@name</span>
                            </td>
                            <td class="text-center">
                                <span class="badge rounded-pill badge-role" th:text="${user.role}"
                                    th:classappend="${user.role == 'ADMIN' ? 'bg-danger' : (user.role == 'MODERATOR' ? 'bg-info' : 'bg-success')}">
                                    usuario
                                </span>
                            </td>
                            <td th:text="${#temporals.format(user.createdAt, 'dd/MM/yyyy HH:mm')}">xx/xx/xxxx</td>
                            <td class="text-center">
                                <button type="button" class="btn action-icon text-danger p-0 border-0 bg-transparent"
                                    data-bs-toggle="modal" data-bs-target="#deleteUserModal"
                                    th:data-user-id="${user.id}" th:data-user-name="${user.name}">
                                    <i class="bi bi-trash-fill"></i>
                                </button>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="4" class="text-center p-4">No se encontraron usuarios.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Paginación -->
            <nav th:if="${totalPages > 1}" aria-label="Page navigation">
                <ul class="pagination justify-content-center mt-4">

                    <!-- Botón Anterior -->
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link"
                            th:href="@{/admin/usuarios(page=${currentPage-1}, keyword=${keyword}, role=${selectedRole})}"
                            aria-label="Previous">
                            <span aria-hidden="true">&laquo;</span>
                        </a>
                    </li>

                    <!-- Números de página -->
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages-1)}"
                        th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link"
                            th:href="@{/admin/usuarios(page=${i}, keyword=${keyword}, role=${selectedRole})}"
                            th:text="${i+1}"></a>
                    </li>

                    <!-- Botón Siguiente -->
                    <li class="page-item" th:classappend="${currentPage == totalPages-1} ? 'disabled'">
                        <a class="page-link"
                            th:href="@{/admin/usuarios(page=${currentPage+1}, keyword=${keyword}, role=${selectedRole})}"
                            aria-label="Next">
                            <span aria-hidden="true">&raquo;</span>
                        </a>
                    </li>

                </ul>
            </nav>

        </div>
    </main>

    <!-- Offcanvas -->
    <div class="offcanvas offcanvas-end filter-offcanvas" tabindex="-1" id="filterUsersOffcanvas">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Filtrar Usuarios</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body">
            <form th:action="@{/admin/usuarios}" method="get">
                <div class="mb-3">
                    <label for="filterRole" class="form-label">Rol de Usuario</label>
                    <select class="form-select" id="filterRole" name="role">
                        <option value="">Todos los roles</option>
                        <option value="USER" th:selected="${param.role == 'USER'}">Usuario</option>
                        <option value="ADMIN" th:selected="${param.role == 'ADMIN'}">Administrador</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-primary w-100">Aplicar Filtros</button>
                <a th:href="@{/admin/usuarios}" class="btn btn-secondary w-100 mt-2">Limpiar Filtros</a>
            </form>
        </div>
    </div>

    <!-- Modal Eliminar -->
    <div class="modal fade" id="deleteUserModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Confirmar Eliminación de Usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="fs-5">¿Estás seguro de que quieres eliminar al usuario <strong
                            id="usernameToDelete"></strong>?</p>
                    <p class="text-danger fw-bold">
                        <i class="bi bi-exclamation-triangle-fill"></i> ¡Esta acción es irreversible!
                    </p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <form id="deleteForm" method="post" style="display: inline;">
                        <button type="submit" class="btn btn-danger">Sí, eliminar usuario</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="layout :: footer"></div>
    <div th:replace="layout :: scripts"></div>

    <!-- Script para el modal de eliminar -->
    <script>
        document.getElementById('deleteUserModal').addEventListener('show.bs.modal', function (event) {
            var button = event.relatedTarget;
            var userId = button.getAttribute('data-user-id');
            var userName = button.getAttribute('data-user-name');

            document.getElementById('usernameToDelete').textContent = userName;
            document.getElementById('deleteForm').action = '/admin/usuarios/eliminar/' + userId;
        });
    </script>

</body>

</html>
