<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head('Gestionar Juegos')}"></head>

<body>

    <div th:replace="~{layout :: header}"></div>

    <main class="main-content-dark">
        <div class="container py-5">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h1 class="text-white">Gestionar Juegos</h1>

                    <form th:action="@{/api/rawg/fetch}" method="post" class="d-inline">
                        <button type="submit" class="btn btn-danger">
                            <i class="fas fa-sign-out-alt me-2"></i> Reestablecer videojuegos
                        </button>
                    </form>

                <a th:href="@{/admin/juegos/nuevo}" class="btn btn-primary">Añadir nuevo juego</a>
            </div>

            <!-- Formulario de Búsqueda -->
            <form th:action="@{/admin/juegos}" method="get" class="mb-4">
                <div class="input-group">
                    <input type="text" name="keyword" class="form-control" placeholder="Buscar por nombre de juego..."
                        th:value="${keyword}">
                    <button class="btn btn-secondary" type="submit">Buscar</button>
                </div>
            </form>

            <!-- Tabla de Juegos -->
            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Fecha de Lanzamiento</th>
                            <th>Rating</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="game : ${games}">
                            <td th:text="${game.id}">1</td>
                            <td th:text="${game.name}">The Witcher 3</td>
                            <td th:text="${game.releaseDate}">2015-05-18</td>
                            <td th:text="${game.rating}">9.3</td>
                            <td>
                                <a th:href="@{/admin/juegos/editar/{id}(id=${game.id})}"
                                    class="btn btn-sm btn-outline-warning">Editar</a>
                                <!-- Aquí podrías añadir un botón de eliminar con confirmación -->
                            </td>
                        </tr>
                        <!-- Mensaje si no hay resultados -->
                        <tr th:if="${#lists.isEmpty(games)}">
                            <td colspan="5" class="text-center">No se encontraron juegos.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div th:replace="~{layout :: footer}"></div>
    <div th:replace="~{layout :: scripts}"></div>

</body>

</html>
