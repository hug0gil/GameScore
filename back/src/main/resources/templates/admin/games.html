<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Gestión de Juegos</title>
</head>
<body>

<div layout:fragment="content">
    <div class="main-content-dark">
        <div class="container py-5">
            
            <!-- 1. CABECERA: Título y Botón "Añadir" -->
            <div class="d-flex justify-content-between align-items-center admin-header pb-3 mb-4">
                <h1 class="text-white mb-0">Gestión de Juegos</h1>
                <a th:href="@{/admin/juegos/nuevo}" class="btn btn-alt">
                    <i class="bi bi-plus-lg"></i> Añadir nuevo juego
                </a>
            </div>

            <!-- 2. BUSCADOR -->
            <form th:action="@{/admin/juegos}" method="get" class="mb-4">
                <div class="input-group auth-box p-0">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="text" name="keyword" class="form-control" placeholder="buscar aqui..." th:value="${keyword}">
                </div>
            </form>

            <!-- 3. TABLA DE JUEGOS -->
            <div class="table-responsive">
                <table class="table table-admin">
                    <thead>
                        <tr>
                            <th>Titulo</th>
                            <th>Plataforma</th>
                            <th>Fecha-Lanzamiento</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Bucle de Thymeleaf para mostrar cada juego -->
                        <tr th:each="game : ${games}">
                            <td>
                                <img th:src="${game.coverUrl}" class="admin-game-thumb" alt="Cover">
                                <span th:text="${game.name}">Super Mario Bros</span>
                            </td>
                            <td th:text="${game.platform}">switch</td>
                            <td th:text="${#dates.format(game.releaseDate, 'dd/MM/yyyy')}">xx/xx/xxxx</td>
                            <td class="text-center">
                                <!-- Acción: Editar -->
                                <a th:href="@{/admin/juegos/editar/{id}(id=${game.id})}" class="action-icon text-primary" title="Editar">
                                    <i class="bi bi-pencil-fill"></i>
                                </a>
                                <!-- Acción: Eliminar (con modal de confirmación) -->
                                <button type="button" class="btn action-icon text-danger p-0 border-0 bg-transparent"
                                        data-bs-toggle="modal" data-bs-target="#deleteModal"
                                        th:attr="data-game-id=${game.id}, data-game-name=${game.name}" title="Eliminar">
                                    <i class="bi bi-trash-fill"></i>
                                </button>
                            </td>
                        </tr>
                        <!-- Mensaje si no hay juegos -->
                        <tr th:if="${#lists.isEmpty(games)}">
                            <td colspan="4" class="text-center p-4">No se encontraron juegos.</td>
                        </tr>
                    </tbody>
                </table>
            </div>

        </div>
    </div>
    
    <!-- ========================================= -->
    <!-- MODAL DE CONFIRMACIÓN DE BORRADO          -->
    <!-- ========================================= -->
    <div class="modal fade" id="deleteModal" tabindex="-1" aria-labelledby="deleteModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="deleteModalLabel">Confirmar Eliminación</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    ¿Estás seguro de que quieres eliminar el juego "<strong id="gameNameToDelete"></strong>"? Esta acción no se puede deshacer.
                </div>
                <div class="modal-footer">
                    <form th:action="@{/admin/juegos/eliminar}" method="post">
                        <input type="hidden" name="id" id="gameIdToDelete">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-danger">Eliminar</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Añadimos este script al final para manejar el modal -->
    <script layout:fragment="scripts" th:inline="javascript">
        var deleteModal = document.getElementById('deleteModal');
        deleteModal.addEventListener('show.bs.modal', function (event) {
            // Botón que activó el modal
            var button = event.relatedTarget;
            // Extraer info de los atributos data-*
            var gameId = button.getAttribute('data-game-id');
            var gameName = button.getAttribute('data-game-name');

            // Actualizar el contenido del modal
            var modalBodyName = deleteModal.querySelector('#gameNameToDelete');
            var gameIdInput = deleteModal.querySelector('#gameIdToDelete');

            modalBodyName.textContent = gameName;
            gameIdInput.value = gameId;
        });
    </script>
</div>
</body>
</html>
