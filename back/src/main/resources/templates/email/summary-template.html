<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>GameScore Stats</title>
</head>
<body style="background-color: #2D2D2D; padding: 20px; font-family: 'Courier New', Courier, monospace; color: #333;">
    
    <div style="max-width: 600px; margin: 0 auto; background: #fff; border: 4px solid #000; box-shadow: 10px 10px 0 #F38801; padding: 20px;">
        
        <!-- HEADER -->
        <div style="border-bottom: 4px dashed #000; padding-bottom: 15px; text-align: center;">
            <h1 style="color: #FFB800; text-shadow: 2px 2px 0 #000; margin: 0;">GAME SCORE 🎮</h1>
            <p style="margin: 5px 0 0 0; font-size: 12px; color: #666;">REPORTE DE JUGADOR</p>
        </div>

        <!-- SALUDO -->
        <div style="padding: 20px 0; text-align: center;">
            <p style="font-size: 18px;">Hola, <strong th:text="${user?.name}">Jugador</strong>!</p>
            <p>Aquí tienes tus estadísticas actualizadas:</p>
        </div>
        
        <!-- ESTADÍSTICAS (TABLA CORREGIDA) -->
        <table style="width: 100%; text-align: center; border-collapse: collapse; margin-bottom: 20px;">
            <tr>
                <!-- 1. LOGIN COUNT -->
                <td style="border: 2px solid #000; padding: 15px; width: 50%;">
                    <h2 th:text="${loginCount ?: 0}" style="color: #55B957; font-size: 36px; margin: 0; text-shadow: 2px 2px 0 #000;">0</h2>
                    <small style="text-transform: uppercase; font-weight: bold;">Inicios de Sesión</small>
                </td>
                
                <!-- 2. REVIEWS COUNT (CORREGIDO) -->
                <td style="border: 2px solid #000; padding: 15px; width: 50%;">
                    <!-- Usamos la variable reviewsCount que creamos en el servicio -->
                    <h2 th:text="${reviewsCount ?: 0}" style="color: #DB4040; font-size: 36px; margin: 0; text-shadow: 2px 2px 0 #000;">0</h2>
                    <small style="text-transform: uppercase; font-weight: bold;">Reseñas Enviadas</small>
                </td>
            </tr>
        </table>

        <!-- 3. LISTA DE FAVORITOS (TEXTO) -->
        <div style="background-color: #eee; border: 2px solid #000; padding: 15px;">
            <h3 style="margin-top: 0; font-size: 14px; text-transform: uppercase; border-bottom: 2px solid #000; padding-bottom: 5px;">
                TUS JUEGOS TOP:
            </h3>
            <ul style="padding-left: 20px; margin-bottom: 0;">
                <li th:each="gameName : ${favoriteGamesList}" th:text="${gameName}" style="margin-bottom: 5px;">
                    Nombre del Juego
                </li>
            </ul>
        </div>
        
        <!-- BOTÓN -->
        <div style="text-align: center; margin-top: 30px;">
            <a href="http://localhost:8080" style="background: #000; color: #fff; padding: 15px 30px; text-decoration: none; font-weight: bold; display: inline-block;">
                VOLVER A JUGAR
            </a>
        </div>
    </div>
    
    <div style="text-align: center; color: #888; font-size: 10px; margin-top: 20px;">
        &copy; 2025 GameScore Systems.
    </div>
</body>
</html>
