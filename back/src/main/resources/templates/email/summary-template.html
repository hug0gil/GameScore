<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!-- CORRECCIÓN 1: Cerrar la etiqueta meta con /> -->
    <meta charset="UTF-8" />
    <title>GameScore Resumen</title>
</head>
<body style="background-color: #2D2D2D; padding: 20px; font-family: sans-serif;">
    
    <div style="max-width: 600px; margin: 0 auto; background: #fff; border: 4px solid #000; padding: 20px;">
        <h1 style="color: #FFB800; text-align: center;">GAME SCORE 🎮</h1>
        
        <!-- CORRECCIÓN 2: Uso de ? para evitar error si user es null -->
        <p>Hola <strong th:text="${user?.name ?: 'Jugador'}">Usuario</strong>,</p>
        <p>Aquí tienes tu resumen semanal:</p>
        
        <table style="width: 100%; text-align: center; margin-top: 20px;">
            <tr>
                <td>
                    <!-- CORRECCIÓN 3: Valores por defecto -->
                    <h2 th:text="${totalReviews ?: 0}" style="color: #55B957;">0</h2>
                    <small>Reseñas</small>
                </td>
                <td>
                    <h2 th:text="${avgScore ?: 0.0}" style="color: #DB4040;">0</h2>
                    <small>Puntuación Media</small>
                </td>
                <td>
                    <h2 th:text="${gamesPlayed ?: 0}" style="color: #FFB800;">0</h2>
                    <small>Juegos</small>
                </td>
            </tr>
        </table>
        
        <div style="text-align: center; margin-top: 30px;">
            <a href="http://localhost:8080" style="background: #000; color: #fff; padding: 10px 20px; text-decoration: none;">IR A LA WEB</a>
        </div>
    </div>
</body>
</html>
