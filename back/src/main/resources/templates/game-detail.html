<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head(${game.name})"></head>
<body>

<!-- HEADER -->
<div th:replace="layout :: header"></div>

<main class="main-content-dark game-detail-page">
    <div class="container py-5">

        <!-- 1. BANNER DEL JUEGO -->
        <img th:src="${game.bannerUrl}" th:alt="'Banner de ' + ${game.name}" class="img-fluid rounded shadow-sm mb-4">

        <!-- 2. DESCRIPCIÓN -->
        <h2 class="section-title">Descripción</h2>
        <p class="text-white-50" th:text="${game.description}">
            Aquí va la descripción detallada del videojuego, explicando la trama, jugabilidad y características principales.
        </p>

        <!-- 3. DETALLES DEL JUEGO + RESEÑAS + MULTIMEDIA -->
        <div class="details-box mt-4">
            <div class="row">
                <!-- Columna izquierda: Detalles del juego + Reseñas -->
                <div class="col-md-6">
                    <h3>Detalles del juego</h3>
                    <div class="details-list">
                        <p><strong>Nombre:</strong> <span th:text="${game.name}">Super Mario Bros.</span></p>
                        <p><strong>Actualización:</strong> <span th:text="${#dates.format(game.releaseDate, 'dd/MM/yyyy')}">13/09/1985</span></p>
                        <!-- Si tienes una lista de plataformas -->
                        <p><strong>Plataforma:</strong>
                            <span th:each="p : ${game.platforms}" th:text="${p.name}" th:unless="${#lists.isEmpty(game.platforms)}" class="me-2">Nintendo</span>
                        </p>
                    </div>

                    <h3 class="mt-4">Reseñas</h3>
                    <div class="review-stars">
                        <span th:each="i : ${#numbers.sequence(1, 5)}">
                            <i class="bi bi-star-fill star" th:classappend="${i <= game.rating ? 'filled' : ''}"></i>
                        </span>
                    </div>
                </div>

                <!-- Columna derecha: Galería de imágenes y videos -->
                <div class="col-md-6">
                    <h3>Screenshots y videos</h3>
                    <div class="row g-3 media-gallery">
                        <div class="col-6" th:each="media : ${game.mediaList}">
                            <a th:href="${media.url}" data-bs-toggle="tooltip"
                               th:title="${media.type == 'video' ? 'Ver video' : 'Ver imagen'}">
                                <img th:src="${media.thumbnailUrl}" class="img-fluid rounded" alt="media del juego">
                                <i class="bi bi-play-circle-fill play-icon" th:if="${media.type == 'video'}"></i>
                            </a>
                        </div>
                    </div>
                </div>

            </div>
        </div>

    </div>
</main>

<!-- FOOTER -->
<div th:replace="layout :: footer"></div>
<!-- SCRIPTS -->
<div th:replace="layout :: scripts"></div>

</body>
</html>
