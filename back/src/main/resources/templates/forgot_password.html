<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - GameScore</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Usamos el mismo CSS que el login -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="icon" th:href="@{/images/GameScoreLogo.png}" type="image/png">
</head>

<body class="login-page">

    <div class="login-container">
        <!-- Video de fondo (Igual que en Login) -->
        <div class="video-wrapper">
            <video th:src="@{/videos/retrowave.mp4}" autoplay muted loop playsinline></video>
        </div>

        <!-- Overlay -->
        <div class="video-overlay"></div>

        <!-- Tarjeta Central -->
        <div class="login-card">
            <div class="card-header">
                <a th:href="@{/}">
                    <img th:src="@{/images/Joystick.png}" alt="Joystick">
                </a>
                <h1>GAME SCORE</h1>
            </div>

            <!-- Título o Instrucción estilo Retro -->
            <p class="insert-coin">RECOVER MODE</p>
            
            <p style="text-align: center; font-size: 0.9rem; color: #666; margin-bottom: 20px; padding: 0 10px;">
                Introduce tu correo electrónico y te enviaremos un enlace mágico para restaurar tu acceso.
            </p>

            <!-- 1. MENSAJE DE ÉXITO (Correo enviado) -->
            <div th:if="${message}" 
                 style="background-color: #d4edda; color: #155724; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center; border: 1px solid #c3e6cb;">
                <i class="fas fa-paper-plane"></i> <span th:text="${message}"></span>
            </div>

            <!-- 2. MENSAJE DE ERROR (Email no encontrado / no es local) -->
            <div th:if="${error}" class="alert alert-danger" 
                 style="text-align: center;">
                <i class="fas fa-exclamation-triangle"></i> <span th:text="${error}"></span>
            </div>

            <!-- FORMULARIO -->
            <form th:action="@{/olvide-password}" method="post">

                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" name="email" class="form-control-retro" placeholder="Tu Correo Electrónico" required autofocus>
                </div>

                <button type="submit" class="btn-login local">
                    <i class="fas fa-share-square"></i> ENVIAR ENLACE
                </button>
            </form>

            <!-- SEPARADOR -->
            <div class="divider-text">
                <span>o</span>
            </div>

            <!-- VOLVER AL LOGIN -->
            <div class="register-link">
                <p>¿Ya te acordaste? <a th:href="@{/login}">Volver al Login</a></p>
            </div>

        </div>
    </div>

</body>
</html>
