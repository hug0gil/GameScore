<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout :: head(${review.id == null ? 'Nueva Reseña' : 'Editar Reseña'})}"></head>

<body>

    <div th:replace="~{layout :: header}"></div>

    <main class="main-content-dark">
        <div class="container py-5">

            <h1 class="text-white mb-4" th:text="${review.id == null ? 'Añadir nueva reseña' : 'Editar Reseña'}">
                Formulario de Reseña
            </h1>

            <!-- Alertas -->
            <div th:if="${successMessage}" class="alert alert-success" role="alert" th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger" role="alert" th:text="${errorMessage}"></div>

            <!-- FORMULARIO -->
            <form th:action="${review.id == null} ? @{/reviews/nueva} : @{/reviews/editar/{id}(id=${review.id})}"
                th:object="${review}" method="post" class="text-white">

                <!-- ID de la reseña (Solo si editamos) -->
                <input type="hidden" th:if="${review.id != null}" name="id" th:value="${review.id}" />

                <div class="row">
                    <!-- CAMPO JUEGO -->
                    <div class="col-md-8 mb-3">
                        <label class="form-label">Juego</label>

                        <!-- CASO 1: Venimos desde la página de un juego (currentGame existe) -->
                        <div th:if="${currentGame != null}">
                            <input type="text" class="form-control bg-dark text-white-50" 
                                   th:value="${currentGame.name}" readonly />
                            
                            <!-- CORRECCIÓN CLAVE: Usamos name y value directos -->
                            <input type="hidden" name="game.id" th:value="${currentGame.id}" />
                        </div>

                        <!-- CASO 2: No hay juego seleccionado (Select) -->
                        <div th:unless="${currentGame != null}">
                            <select class="form-select" name="game.id" required>
                                <option value="">Selecciona un juego</option>
                                <option th:each="g : ${games}" th:value="${g.id}" th:text="${g.name}"></option>
                            </select>
                        </div>
                    </div>

                    <!-- CAMPO CALIFICACIÓN -->
                    <div class="col-md-4 mb-3">
                        <label class="form-label">Calificación (1-5) *</label>
                        <div class="d-flex align-items-center">
                            <div class="rating-input me-3">
                                <!-- Estrellas -->
                                <th:block th:each="i : ${#numbers.sequence(1, 5)}">
                                    <input type="radio" th:id="'star'+${i}" name="rating" th:value="${i}" 
                                           th:field="*{rating}" required />
                                    <label th:for="'star'+${i}" th:title="${i} + ' estrellas'"></label>
                                </th:block>
                            </div>
                            <div class="rating-value">
                                <span th:text="${review.rating != null} ? ${review.rating} : '0'">0</span> / 5
                            </div>
                        </div>
                        <div class="text-danger" th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}"></div>
                    </div>
                </div>

                <!-- CAMPO TÍTULO -->
                <div class="mb-3">
                    <label for="title" class="form-label">Título *</label>
                    <input type="text" class="form-control" id="title" th:field="*{title}" maxlength="100" required />
                    
                    <small class="form-text text-white-50">Máximo 100 caracteres. (<span class="char-count"
                            th:text="${review.title != null ? #strings.length(review.title) : 0}">0</span>/100)</small>
                    <div class="text-danger" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></div>
                </div>

                <!-- CAMPO CONTENIDO -->
                <div class="mb-4">
                    <label for="content" class="form-label">Contenido</label>
                    <textarea class="form-control" id="content" th:field="*{content}" rows="6" minlength="0"
                        maxlength="1000"></textarea>

                    <small class="form-text text-white-50">Máximo 1000 caracteres. (<span class="char-count"
                            th:text="${review.content != null ? #strings.length(review.content) : 0}">0</span>/1000)</small>
                    <div class="text-danger" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></div>
                </div>

                <!-- BOTONES -->
                <button type="submit" class="btn btn-warning btn-lg me-2">
                    <i class="bi bi-send-fill"></i> Enviar Reseña
                </button>
                
                <a th:href="@{/juego/{slug}(slug=${currentGame != null ? currentGame.slug : ''})}"
                    class="btn btn-secondary btn-lg">Cancelar</a>

            </form>
        </div>
    </main>

    <div th:replace="~{layout :: footer}"></div>
    <div th:replace="~{layout :: scripts}"></div>

    <script th:inline="javascript">
        // Contador de caracteres en tiempo real
        document.addEventListener('DOMContentLoaded', function () {
            // Título
            const titleInput = document.getElementById('title');
            if (titleInput) {
                titleInput.addEventListener('input', function () {
                    const counter = this.parentElement.querySelector('.char-count');
                    counter.textContent = this.value.length;
                });
            }

            // Comentario
            const commentInput = document.getElementById('content');
            if (commentInput) {
                commentInput.addEventListener('input', function () {
                    const counter = this.parentElement.querySelector('.char-count');
                    counter.textContent = this.value.length;
                });
            }

            // Actualizar valor de rating visual
            const ratingInputs = document.querySelectorAll('input[name="rating"]');
            const ratingValue = document.querySelector('.rating-value span');

            ratingInputs.forEach(input => {
                input.addEventListener('change', function () {
                    if (ratingValue) {
                        ratingValue.textContent = this.value;
                    }
                });
            });
        });
    </script>

</body>
</html>
