<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva Contraseña - GameScore</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-container">
        <!-- Video de fondo (Opcional, para mantener consistencia) -->
        <div class="video-wrapper">
            <video th:src="@{/videos/retrowave.mp4}" autoplay muted loop playsinline></video>
        </div>
        <div class="video-overlay"></div>

        <div class="login-card">
            <div class="card-header">
                <img th:src="@{/images/Joystick.png}" alt="Joystick">
                <h1>GAME SCORE</h1>
            </div>

            <h2>Nueva Contraseña</h2>

            <!-- Mensaje de Error (Token expirado o inválido) -->
            <div th:if="${error}" class="alert alert-danger">
                <i class="fas fa-exclamation-triangle"></i> <span th:text="${error}"></span>
            </div>

            <!-- Formulario -->
            <!-- Solo mostramos el form si no hay errores con el token -->
            <form th:if="${error == null}" th:action="@{/cambiar-password}" method="post">
                
                <!-- INPUT OCULTO CON EL TOKEN -->
                <input type="hidden" name="token" th:value="${token}" />

                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" class="form-control-retro" placeholder="Escribe tu nueva contraseña" required autofocus>
                </div>

                <button type="submit" class="btn-login local">
                    <i class="fas fa-save"></i> Guardar Cambios
                </button>
            </form>
            
            <!-- Si hay error, botón para volver a intentar -->
            <div th:if="${error}" style="text-align: center; margin-top: 15px;">
                <a th:href="@{/olvide-password}" class="btn-login google">Solicitar nuevo enlace</a>
            </div>

        </div>
    </div>
</body>
</html>
