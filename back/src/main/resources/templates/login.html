<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameScore - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="icon" th:href="@{/images/GameScoreLogo.png}" type="image/png">
</head>

<body class="login-page">

    <div class="login-container">
        <!-- Video de fondo -->
        <div class="video-wrapper">
            <video th:src="@{/videos/retrowave.mp4}" autoplay muted loop playsinline></video>
        </div>

        <!-- Overlay -->
        <div class="video-overlay"></div>

        <!-- Mensaje de logout (Posicionado absoluto arriba) -->
        <div th:if="${logoutMsg}" class="alert logout-msg">
            <span th:text="${logoutMsg}"></span>
        </div>

        <!-- Tarjeta Central -->
        <div class="login-card">
            <div class="card-header">
                <a th:href="@{/}">
                    <img th:src="@{/images/Joystick.png}" alt="Joystick">
                </a>
                <h1>GAME SCORE</h1>
            </div>

            <!-- 1. MENSAJE DE ÉXITO AL CAMBIAR CONTRASEÑA -->
            <!-- Estilos inline para asegurar visibilidad (Fondo verde claro, texto verde oscuro) -->
            <div th:if="${param.resetSuccess}" 
                 style="background-color: #d4edda; color: #155724; padding: 10px; border-radius: 5px; margin-bottom: 15px; text-align: center; border: 1px solid #c3e6cb;">
                <i class="fas fa-check-circle"></i> Contraseña actualizada. ¡Inicia sesión!
            </div>

            <!-- 2. MENSAJE DE ERROR DE LOGIN -->
            <div th:if="${param.error}" class="alert alert-danger">
                <i class="fas fa-skull"></i> Usuario o contraseña incorrectos. Game Over.
            </div>

            <p class="insert-coin">INSERT COIN OR LOGIN</p>

            <!-- FORMULARIO -->
            <form th:action="@{/login}" method="post">

                <!-- Usuario -->
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" name="username" class="form-control-retro" placeholder="Usuario o Email" required autofocus>
                </div>

                <!-- Contraseña -->
                <div class="input-group" style="margin-bottom: 5px;">
                    <i class="fas fa-lock"></i>
                    <input type="password" name="password" class="form-control-retro" placeholder="Contraseña" required>
                </div>

                <!-- 3. ENLACE OLVIDÉ CONTRASEÑA -->
                <!-- Color cambiado a #555 para que se vea sobre fondo blanco -->
                <div class="forgot-pass" style="text-align: right; margin-bottom: 15px;">
                    <a th:href="@{/olvide-password}" style="font-size: 0.85em; color: #555; text-decoration: none;">
                        ¿Olvidaste tu contraseña?
                    </a>
                </div>

                <!-- Botón Login -->
                <button type="submit" class="btn-login local">
                    <i class="fas fa-gamepad"></i> START GAME
                </button>
            </form>

            <!-- ENLACE AL REGISTRO -->
            <div class="register-link">
                <p>¿No tienes cuenta? <a th:href="@{/registro}">Regístrate aquí</a></p>
            </div>

            <!-- SEPARADOR -->
            <div class="divider-text">
                <span>o conecta con</span>
            </div>

            <!-- LOGIN SOCIAL -->
            <div class="actions">
                <a class="btn-login google" href="/oauth2/authorization/google">
                    <i class="fab fa-google"></i> <span>Google</span>
                </a>
                <a class="btn-login github" href="/oauth2/authorization/github">
                    <i class="fab fa-github"></i> <span>GitHub</span>
                </a>
                <a class="btn-login discord" href="/oauth2/authorization/discord">
                    <i class="fab fa-discord"></i> <span>Discord</span>
                </a>
            </div>
        </div>
    </div>

</body>
</html>
