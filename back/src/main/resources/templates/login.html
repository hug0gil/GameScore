<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameScore - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="icon" th:href="@{/images/GameScoreLogo.png}" type="image/png">
</head>

<!-- Clase login-page obligatoria -->
<body class="login-page">

    <div class="login-container">
        <!-- Video -->
        <div class="video-wrapper">
            <video th:src="@{/videos/retrowave.mp4}" autoplay muted loop playsinline></video>
        </div>
        
        <!-- Overlay -->
        <div class="video-overlay"></div>

        <!-- Tarjeta Central -->
        <div class="login-card">
            <div class="card-header">
                <a th:href="@{/}">
                <img th:src="@{/images/Joystick.png}" alt="Joystick">
                </a>
                <h1>GAME SCORE</h1>
            </div>
            
            <p class="insert-coin">INSERT COIN TO START</p>
            
            <div class="divider"></div>
            
            <div class="actions">
                <!-- Botones con clases de marca -->
                <a class="btn-login google" href="/oauth2/authorization/google">
                    <i class="fab fa-google"></i> <span>Google</span>
                </a>
                <a class="btn-login github" href="/oauth2/authorization/github">
                    <i class="fab fa-github"></i> <span>GitHub</span>
                </a>
                <a class="btn-login discord" href="/oauth2/authorization/discord">
                    <i class="fab fa-discord"></i> <span>Discord</span>
                </a>
            </div>
        </div>
    </div>

</body>
</html>
