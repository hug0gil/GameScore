<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Iniciar Sesión</title>
</head>
<body>

<div layout:fragment="content">
    <div class="main-content-dark">
        <div class="container py-5">
            <div class="auth-form-container">
                
                <!-- Logo -->
                <div class="text-center mb-5">
                    <a th:href="@{/}"><img th:src="@{/images/logo-horizontal.png}" alt="GameScore Logo" style="max-width: 200px;"></a>
                </div>

                <!-- Título del formulario -->
                <h2 class="text-center text-white mb-4">Iniciar Sesión</h2>

                <!-- 
                    Formulario de Login compatible con Spring Security.
                    - th:action="@{/login}" es la ruta por defecto que procesa el login.
                    - Los campos `name="username"` y `name="password"` son los esperados por Spring Security.
                -->
                <form th:action="@{/login}" method="post">
                    
                    <!-- Mensaje de error (se muestra si el login falla) -->
                    <div th:if="${param.error}" class="alert alert-danger" role="alert">
                        Usuario o contraseña incorrectos.
                    </div>

                    <!-- Campo de Usuario/Email -->
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="username" name="username" placeholder="Tu usuario" required autofocus>
                        <label for="username">Usuario</label>
                    </div>

                    <!-- Campo de Contraseña -->
                    <div class="form-floating mb-4">
                        <input type="password" class="form-control" id="password" name="password" placeholder="Contraseña" required>
                        <label for="password">Contraseña</label>
                    </div>

                    <!-- Opciones: Recordarme y Olvidé contraseña -->
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember-me" name="remember-me">
                            <label class="form-check-label text-white-50" for="remember-me">
                                Recordarme
                            </label>
                        </div>
                        <a th:href="@{/forgot-password}" class="small-link">¿Olvidaste tu contraseña?</a>
                    </div>
                    
                    <!-- Botón de Submit -->
                    <button type="submit" class="btn btn-primary w-100 btn-lg">Entrar</button>

                </form>

                <!-- Enlace para registrarse -->
                <div class="text-center mt-4">
                    <p class="text-white-50">¿No tienes una cuenta? <a th:href="@{/registro}" class="small-link text-white fw-bold">Regístrate aquí</a></p>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
