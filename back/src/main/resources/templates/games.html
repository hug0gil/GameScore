<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="layout :: head('Juegos')"></head>
<body>

<!-- Header de navegación -->
<div th:replace="layout :: header"></div>

<!-- Contenido principal -->
<main class="main-content-dark py-5">
    <div class="container">

        <!-- Fila destacada -->
        <div class="featured-row mb-5">
            <div class="row g-4 justify-content-center">
                <div class="col-lg-3 col-md-4" th:each="game : ${featuredGames}">
                    <a th:href="@{'/juego/' + ${game.slug}}" class="game-card">
                        <img th:src="${game.backgroundUrl}" class="card-img-top" alt="Portada de juego">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <h5 class="card-title mb-0" th:text="${game.name}">Nombre del Juego</h5>
                                <span class="rating">
                                    <span th:text="${game.rating}">5</span> <i class="bi bi-star-fill star"></i>
                                </span>
                            </div>
                        </div>
                    </a>
                </div>
            </div>
        </div>

        <!-- Lista de juegos normales -->
        <div class="row g-4">
            <div class="col-lg-3 col-md-4" th:each="game : ${games}">
                <a th:href="@{'/juego/' + ${game.slug}}" class="game-card">
                    <img th:src="${game.backgroundUrl}" class="card-img-top" alt="Portada de juego">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center">
                            <h5 class="card-title mb-0" th:text="${game.name}">Nombre del Juego</h5>
                            <span class="rating">
                                <span th:text="${game.rating}">5</span> <i class="bi bi-star-fill star"></i>
                            </span>
                        </div>
                    </div>
                </a>
            </div>
        </div>

    </div>
</main>

<!-- Footer -->
<div th:replace="layout :: footer"></div>
<!-- Scripts JS -->
<div th:replace="layout :: scripts"></div>

</body>
</html>
