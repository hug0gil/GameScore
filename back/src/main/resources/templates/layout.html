<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE | $LAYOUT_TITLE">GameScore</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <!-- Nuestro CSS Personalizado -->
    <link rel="stylesheet" th:href="@{/css/custom-styles.css}">
    <!-- Chart.js (para los gráficos del dashboard) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- ============================================= -->
    <!-- HEADER / NAVBAR                               -->
    <!-- ============================================= -->
    <header class="app-header">
        <nav class="navbar navbar-expand-lg">
            <div class="container">
                <a class="navbar-brand" th:href="@{/}">
                    <img th:src="@{/images/logo-horizontal.png}" alt="GameScore Logo" height="40">
                </a>

                <div class="ms-auto d-flex align-items-center">
                    <a th:href="@{/games}" class="btn btn-sm btn-primary me-2">Games</a>
                    <a th:href="@{/foro}" class="btn btn-sm btn-alt me-3">Foro</a>
                    <a th:href="@{/perfil}" class="user-icon">
                        <i class="bi bi-person-fill"></i>
                    </a>
                </div>
            </div>
        </nav>
    </header>

    <!-- ============================================= -->
    <!-- CONTENIDO PRINCIPAL (DINÁMICO)                -->
    <!-- ============================================= -->
    <main class="flex-grow-1" layout:fragment="content">
        <!-- El contenido de cada página se insertará aquí -->
    </main>

    <!-- ============================================= -->
    <!-- FOOTER                                        -->
    <!-- ============================================= -->
    <footer class="app-footer">
        <div class="container text-center">
            <a th:href="@{/sobre-nosotros}">Sobre Nosotros</a>
            <a th:href="@{/politica-privacidad}">Política de Privacidad</a>
            <a th:href="@{/etc}">Etc</a>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Tu JS personalizado -->
    <script th:src="@{/js/main.js}"></script>
</body>

</html>
