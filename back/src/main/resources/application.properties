spring.application.name=game-score
server.port=8080

# --- BASE DE DATOS (MANTENER) ---
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- LOGGING (MANTENER) ---
logging.level.root=INFO
logging.level.com.gamescore.back=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# --- THYMELEAF (NUEVO - ACTIVADO) ---
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html

# --- OAUTH2 CLIENTS (MANTENER - SIRVEN IGUAL) ---
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri={baseUrl}/login/oauth2/code/github

spring.security.oauth2.client.registration.discord.client-id=${DISCORD_CLIENT_ID}
spring.security.oauth2.client.registration.discord.client-secret=${DISCORD_CLIENT_SECRET}
spring.security.oauth2.client.registration.discord.scope=identify,email
spring.security.oauth2.client.registration.discord.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.discord.redirect-uri={baseUrl}/login/oauth2/code/discord

spring.security.oauth2.client.provider.discord.authorization-uri=https://discord.com/api/oauth2/authorize
spring.security.oauth2.client.provider.discord.token-uri=https://discord.com/api/oauth2/token
spring.security.oauth2.client.provider.discord.user-info-uri=https://discord.com/api/users/@me
spring.security.oauth2.client.provider.discord.user-name-attribute=id

# ==============================================================
# CONFIGURACIÓN DE EMAIL (MODIFICAR CON TUS DATOS)
# ==============================================================
mailjet.apiKey=${EMAIL_API_KEY}
mailjet.secretKey=${EMAIL_CLIENT_SECRET}
mailjet.sender.email=gamescore.proyectogrupal@gmail.com
app.base.url=http://localhost:8080

# ==============================================================
# APIs EXTERNAS (MANTENER)
# ==============================================================
sendgrid.api.key=${SENDGRID_API_KEY}
sendgrid.from.email=noreply@gamescore.com
sendgrid.from.name=GameScore

rawg.api.key=${RAWG_API_KEY}
rawg.api.url=https://api.rawg.io/api

youtube.api.key=${YOUTUBE_API_KEY}


# =======================
# CONFIGURACIÓN DE LOGGING
# =======================

# 1. Especifica el nombre y la ubicación del archivo de log.
# Se creará un archivo llamado 'app.log' en la carpeta raíz de tu proyecto.
logging.file.name=app.log

# 2. (Opcional) Define el nivel de log para paquetes específicos.
# Esto asegura que los mensajes de nuestro servicio se muestren.
# Queremos ver los mensajes de nivel INFO y superior de nuestro paquete de servicios.
logging.level.com.gamescore.back.service=INFO

# 3. (Opcional) Define el patrón de los mensajes en el archivo.
# Este patrón es muy completo, incluye fecha, hora, nivel, thread y el mensaje.
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
