<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>Iniciar Sesión</title>
</head>
<body>

<div layout:fragment="content">
    <div class="main-content-dark">
        <div class="container py-5">
            <div class="auth-form-container text-center">
                
                <div class="mb-5">
                    <img th:src="@{/images/logo-horizontal.png}" alt="GameScore Logo" style="max-width: 200px;">
                </div>

                <h2 class="text-white mb-4">Elige un método para continuar</h2>

                <!-- Mensaje de éxito al cerrar sesión -->
                <div th:if="${param.logout}" class="alert alert-info">
                    Has cerrado sesión correctamente.
                </div>
                
                <div class="d-grid gap-3">
                    <!-- 
                        Estos enlaces apuntan a las URLs estándar que Spring Boot crea para cada proveedor.
                        El formato es /oauth2/authorization/{registrationId}
                        Donde {registrationId} es el nombre que le das en application.properties (ej. "google", "github").
                    -->
                    <a href="/oauth2/authorization/google" class="btn btn-light btn-lg d-flex align-items-center justify-content-center">
                        <i class="bi bi-google me-2"></i> Continuar con Google
                    </a>
                    <a href="/oauth2/authorization/github" class="btn btn-dark btn-lg d-flex align-items-center justify-content-center">
                        <i class="bi bi-github me-2"></i> Continuar con GitHub
                    </a>
                    <a href="/oauth2/authorization/discord" class="btn btn-lg d-flex align-items-center justify-content-center" style="background-color: #5865F2; color: white;">
                        <i class="bi bi-discord me-2"></i> Continuar con Discord
                    </a>
                </div>

            </div>
        </div>
    </div>
</div>

</body>
</html>
