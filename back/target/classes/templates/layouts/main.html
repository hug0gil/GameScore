<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--todos los th:fragment sirven pa poder reutilizar la plantilla-->
<head th:fragment="head">
    <meta charset="UTF-8">
    <title>GameScore</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Nuestro CSS propio -->
    <link th:href="@{/css/estilos.css}" rel="stylesheet">
</head>
<body>

    <!-- NAVBAR (fragmento) -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark" th:fragment="navbar">
        <div class="container">
            <a class="navbar-brand" th:href="@{/}">GameScore</a>

            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/games}">Juegos</a>
                    </li>
                </ul>

                <!-- Área de login/logout -->
                <div class="d-flex text-white">
                    <!-- Si NO estás autenticado -->
                    <div sec:authorize="!isAuthenticated()">
                        <a th:href="@{/oauth2/authorization/google}" class="btn btn-outline-light btn-sm me-2">Google</a>
                        <a th:href="@{/oauth2/authorization/github}" class="btn btn-outline-light btn-sm me-2">GitHub</a>
                        <a th:href="@{/oauth2/authorization/discord}" class="btn btn-outline-light btn-sm">Discord</a>
                    </div>

                    <!-- Si estás autenticado -->
                    <div sec:authorize="isAuthenticated()" class="ms-3">
                        Hola, <span sec:authentication="name">usuario</span>
                        <form th:action="@{/logout}" method="post" class="d-inline">
                            <button type="submit" class="btn btn-danger btn-sm ms-2">Salir</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <!-- SCRIPTS (fragmento) -->
    <div th:fragment="scripts" th:remove="tag">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    </div>

</body>
</html>
